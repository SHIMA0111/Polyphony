# Service blocks are kept in alphabetical order (api, db, llm-gateway, migrate, web).
# This is a project convention: when a later step adds a new service (dex, hydra,
# kratos, minio, redis, ...), insert its block in alphabetical position rather than
# appending at the end or reordering existing blocks, so parallel PRs touching this
# file stay additive and disjoint. See docs/infra-conventions.md.
services:
  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://polyphony:polyphony@db:5432/polyphony?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: ${PORT:-8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://llm-gateway:8081}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-30m}
      DB_HEALTH_CHECK_PERIOD: ${DB_HEALTH_CHECK_PERIOD:-1m}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-polyphony-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-polyphony}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-polyphony-minio}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:-change-me-in-production}
      AUTH_MODE: ${AUTH_MODE:-kratos}
      KRATOS_PUBLIC_URL: ${KRATOS_PUBLIC_URL:-http://kratos:4433}
      KRATOS_ADMIN_URL: ${KRATOS_ADMIN_URL:-http://kratos:4434}
      KRATOS_COOKIE_NAME: ${KRATOS_COOKIE_NAME:-ory_kratos_session}
      LLM_GATEWAY_TRANSPORT: ${LLM_GATEWAY_TRANSPORT:-rest}
      LLM_GATEWAY_GRPC_ADDR: ${LLM_GATEWAY_GRPC_ADDR:-llm-gateway:50051}
      LLM_GATEWAY_GRPC_MAX_RETRIES: ${LLM_GATEWAY_GRPC_MAX_RETRIES:-3}
      LLM_GATEWAY_GRPC_BASE_BACKOFF: ${LLM_GATEWAY_GRPC_BASE_BACKOFF:-100ms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MESSAGE_HUB_DRIVER: ${MESSAGE_HUB_DRIVER:-redis}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-gpt-5-mini}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_AI_INVOKE_PER_MINUTE: ${RATE_LIMIT_AI_INVOKE_PER_MINUTE:-20}
      WHOAMI_CACHE_TTL: ${WHOAMI_CACHE_TTL:-30s}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PLANS_JSON: ${STRIPE_PLANS_JSON:-}
      STRIPE_TOKEN_PACKAGES_JSON: ${STRIPE_TOKEN_PACKAGES_JSON:-}
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-http://localhost:3000/billing/checkout/success?session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-http://localhost:3000/billing/checkout/cancel}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      llm-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polyphony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polyphony}
      POSTGRES_DB: ${POSTGRES_DB:-polyphony}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polyphony}"]
      interval: 5s
      timeout: 3s
      retries: 5

  dex:
    image: dexidp/dex:v2.43.1
    volumes:
      - ./ory/dex/config.yaml:/etc/dex/cfg/config.yaml:ro
    command: dex serve /etc/dex/cfg/config.yaml
    ports:
      - "5556:5556"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  hydra:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: ${HYDRA_DSN:-postgres://hydra:hydra@hydra-db:5432/hydra?sslmode=disable}
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:-change-me-32-byte-system-secret}
      URLS_SELF_ISSUER: ${HYDRA_PUBLIC_URL:-http://localhost:4444}/
      # 127.0.0.1, not localhost: avoids IPv6 localhost shadowing when
      # something else on the host is already listening on [::1]:3000 (see
      # ory/README.md's "IPv6 localhost shadowing" note).
      URLS_LOGIN: ${HYDRA_LOGIN_UI_URL:-http://127.0.0.1:3000/oauth/login}
      URLS_CONSENT: ${HYDRA_CONSENT_UI_URL:-http://127.0.0.1:3000/oauth/consent}
    command: serve all -c /etc/config/hydra/hydra.yml --dev
    volumes:
      - ./ory/hydra:/etc/config/hydra:ro
    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4445/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  hydra-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${HYDRA_DB_USER:-hydra}
      POSTGRES_PASSWORD: ${HYDRA_DB_PASSWORD:-hydra}
      POSTGRES_DB: ${HYDRA_DB_NAME:-hydra}
    volumes:
      - hydra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HYDRA_DB_USER:-hydra}"]
      interval: 5s
      timeout: 3s
      retries: 5

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: ${HYDRA_DSN:-postgres://hydra:hydra@hydra-db:5432/hydra?sslmode=disable}
    command: ["migrate", "sql", "-e", "--yes"]
    volumes:
      - ./ory/hydra:/etc/config/hydra:ro
    depends_on:
      hydra-db:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: ${KRATOS_DSN:-postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable}
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET:-dev-32-byte-kratos-cookie-secret}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET:-dev-32-byte-kratos-cipher-secret}
      # Step 44: the entire OIDC providers array (dex/google/github, secrets
      # included) is supplied as a single JSON-string env var so no secret is
      # ever committed to ory/kratos/kratos.yml — see .env.example.
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS: ${KRATOS_OIDC_PROVIDERS_JSON}
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
    ports:
      - "4433:4433"
      - "4434:4434"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4434/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      dex:
        condition: service_healthy

  kratos-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${KRATOS_DB_USER:-kratos}
      POSTGRES_PASSWORD: ${KRATOS_DB_PASSWORD:-kratos}
      POSTGRES_DB: ${KRATOS_DB_NAME:-kratos}
    volumes:
      - kratos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KRATOS_DB_USER:-kratos}"]
      interval: 5s
      timeout: 3s
      retries: 5

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: ${KRATOS_DSN:-postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable}
    command: migrate sql -e --yes
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-db:
        condition: service_healthy

  llm-gateway:
    build:
      # Repo root, not ./llm-gateway: build.rs compiles the shared gRPC contract from
      # server/proto/, which must be inside the build context (see
      # llm-gateway/Dockerfile's header comment).
      context: .
      dockerfile: llm-gateway/Dockerfile
    environment:
      LLM_GATEWAY_PORT: ${LLM_GATEWAY_PORT:-8081}
      LLM_GATEWAY_GRPC_PORT: ${LLM_GATEWAY_GRPC_PORT:-50051}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_GATEWAY_CONNECT_TIMEOUT_SECS: ${LLM_GATEWAY_CONNECT_TIMEOUT_SECS:-10}
      LLM_GATEWAY_REQUEST_TIMEOUT_SECS: ${LLM_GATEWAY_REQUEST_TIMEOUT_SECS:-600}
      LLM_GATEWAY_MAX_RETRIES: ${LLM_GATEWAY_MAX_RETRIES:-3}
      LLM_GATEWAY_RETRY_BASE_DELAY_MS: ${LLM_GATEWAY_RETRY_BASE_DELAY_MS:-500}
    ports:
      - "8081:8081"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436"
      - "4437:4437"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4436/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: arigaio/atlas:latest
    command: >
      migrate apply
      --url "${DATABASE_URL:-postgres://polyphony:polyphony@db:5432/polyphony?sslmode=disable}"
      --dir "file://migrations"
    volumes:
      - ./server/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-polyphony}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-polyphony-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc
    entrypoint: >
      /bin/sh -c "
      mc alias set local ${MINIO_ENDPOINT:-http://minio:9000} ${MINIO_ROOT_USER:-polyphony} ${MINIO_ROOT_PASSWORD:-polyphony-minio} &&
      mc mb -p local/${MINIO_BUCKET:-polyphony-attachments}
      "
    depends_on:
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Forwards Stripe test-mode webhook events to the api container so local
  # development never needs a publicly reachable webhook URL (Step 49). On
  # first start it prints an ephemeral `whsec_...` signing secret to its
  # logs (`docker compose logs stripe-cli` / `task stripe:listen`) — copy
  # that value into `.env`'s STRIPE_WEBHOOK_SECRET and restart the api
  # service for signature verification to succeed.
  stripe-cli:
    image: stripe/stripe-cli:v1.21.7
    command: listen --api-key ${STRIPE_SECRET_KEY:-} --forward-to api:8080/webhooks/stripe --skip-verify
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      API_URL: ${API_URL:-http://api:8080}
      KRATOS_PUBLIC_URL: ${KRATOS_PUBLIC_URL:-http://kratos:4433}
      HYDRA_ADMIN_URL: ${HYDRA_ADMIN_URL:-http://hydra:4445}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # E2E test profile (docs/tasks/step10.md): an isolated copy of the stack on
  # alternate host ports (5433, 8090, 8091, 8092, 8093, 8094, 8095, 3001), plus a
  # canned OpenAI-compatible LLM stub, for Playwright specs. Disabled by default;
  # only started with `--profile test` (see the `test:e2e:*` Taskfile tasks).
  # Kept as one contiguous, alphabetized-among-itself group rather than
  # interleaved into the dev-service alphabet above, to keep this step's diff
  # disjoint from other steps that also touch this file. See
  # docs/infra-conventions.md.
  # ---------------------------------------------------------------------------
  api-e2e:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgres://polyphony:polyphony@db-e2e:5432/polyphony?sslmode=disable
      JWT_SECRET: e2e-test-secret
      PORT: 8080
      CORS_ORIGINS: http://localhost:3001
      LLM_GATEWAY_URL: http://llm-gateway-e2e:8081
      AUTH_MODE: kratos
      KRATOS_PUBLIC_URL: http://kratos-e2e:4433
      KRATOS_ADMIN_URL: http://kratos-e2e:4434
      KRATOS_COOKIE_NAME: ory_kratos_session
      REDIS_URL: redis://redis-e2e:6379/0
      # Presigned URLs are handed back to the browser, which runs on the
      # host (Playwright's `baseURL` is `http://localhost:3001`), not inside
      # the compose network, so they must resolve against a host-published
      # MinIO port. This is *not* the dev stack's `minio` service/port
      # 9000 (that service is untagged and never started by
      # `test:e2e:up`'s explicit service list, and reusing it would leave
      # this stack dependent on whatever else happens to hold port 9000 on
      # the host) -- it is this stack's own dedicated, profiled
      # `minio-e2e` service, published on host port 9002 (see
      # `minio-e2e`/`minio-init-e2e` below).
      S3_ENDPOINT: ${S3_ENDPOINT_E2E:-http://localhost:9002}
      S3_REGION: ${S3_REGION_E2E:-us-east-1}
      S3_BUCKET: ${S3_BUCKET_E2E:-polyphony-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY_E2E:-polyphony}
      S3_SECRET_KEY: ${S3_SECRET_KEY_E2E:-polyphony-minio}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE_E2E:-true}
      # Much higher/looser than the dev-stack defaults above, and a short
      # WHOAMI_CACHE_TTL rather than a long one, so Playwright specs never
      # trip a 429 and logout/revocation specs are not slowed down waiting
      # out a long cache window (Step 33).
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE_E2E:-1000}
      RATE_LIMIT_AI_INVOKE_PER_MINUTE: ${RATE_LIMIT_AI_INVOKE_PER_MINUTE_E2E:-1000}
      WHOAMI_CACHE_TTL: ${WHOAMI_CACHE_TTL_E2E:-1s}
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["test"]
    depends_on:
      migrate-e2e:
        condition: service_completed_successfully
      llm-gateway-e2e:
        condition: service_healthy
      kratos-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
      minio-init-e2e:
        condition: service_completed_successfully

  db-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: polyphony
      POSTGRES_PASSWORD: polyphony
      POSTGRES_DB: polyphony
    ports:
      - "5433:5432"
    volumes:
      - pgdata-e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyphony"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["test"]

  # A dedicated e2e-only dex, distinct from the dev `dex` service above:
  # both are started under different Compose projects (default vs
  # `-p polyphony-e2e`), and Compose's project isolation does not extend to
  # host-published ports — two containers from two different projects both
  # trying to bind the same fixed host port collide (wave-5 review finding).
  # `networks.default.aliases` keeps this container reachable as `dex` from
  # inside the e2e project's own network (matching `KRATOS_OIDC_PROVIDERS_JSON`'s
  # hardcoded `http://dex:5556/dex` issuer/discovery URL used by `kratos-e2e`,
  # and `ory/dex/config.yaml`'s own `issuer`), while its host-published port
  # (8095, distinct from the dev `dex`'s 5556) lets Playwright's browser reach
  # it too — see `web/playwright.config.ts`'s `--host-resolver-rules` mapping.
  dex-e2e:
    image: dexidp/dex:v2.43.1
    volumes:
      - ./ory/dex/config.yaml:/etc/dex/cfg/config.yaml:ro
    command: dex serve /etc/dex/cfg/config.yaml
    ports:
      - "8095:5556"
    networks:
      default:
        aliases:
          - dex
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["test"]

  # A dedicated e2e-only Hydra, distinct from the dev `hydra`/`hydra-db`/
  # `hydra-migrate` services above (Step 55 never added Hydra to the E2E
  # profile at all -- see the wave-7 planning note in
  # docs/tasks/step56.md's "Implementation notes" for why one is needed
  # here). Same reasoning as `dex-e2e`/`kratos-e2e` above: published on its
  # own dedicated host ports (8096 public, 8097 admin) so this stack can run
  # fully alongside a running dev stack without colliding on 4444/4445, and
  # `urls.login`/`urls.consent` point at `web-e2e`'s host-published port
  # (3001) rather than the dev `web` service's 3000.
  hydra-db-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra
      POSTGRES_DB: hydra
    volumes:
      - hydra_pgdata-e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["test"]

  hydra-e2e:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: postgres://hydra:hydra@hydra-db-e2e:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: e2e-32-byte-hydra-system-secret-x
      # Browser-facing: `oauth-hydra.spec.ts` (and Playwright's `request`
      # fixture) reach this directly on the host, not through a proxy, so
      # the issuer must be the host-published URL, not a container-internal
      # one -- mirrors the dev `hydra` service's `URLS_SELF_ISSUER`
      # convention (see that block above).
      URLS_SELF_ISSUER: http://localhost:8096/
      # 127.0.0.1, not localhost: same IPv6-localhost-shadowing rationale as
      # the dev `hydra` service (see ory/README.md's "IPv6 localhost
      # shadowing" note) -- points at `web-e2e`'s host-published port
      # (3001), not the dev `web` service's 3000.
      URLS_LOGIN: http://127.0.0.1:3001/oauth/login
      URLS_CONSENT: http://127.0.0.1:3001/oauth/consent
    command: serve all -c /etc/config/hydra/hydra.yml --dev
    volumes:
      - ./ory/hydra:/etc/config/hydra:ro
    ports:
      - "8096:4444"
      - "8097:4445"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4445/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["test"]
    depends_on:
      hydra-migrate-e2e:
        condition: service_completed_successfully

  hydra-migrate-e2e:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: postgres://hydra:hydra@hydra-db-e2e:5432/hydra?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]
    volumes:
      - ./ory/hydra:/etc/config/hydra:ro
    profiles: ["test"]
    depends_on:
      hydra-db-e2e:
        condition: service_healthy

  kratos-db-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos
      POSTGRES_DB: kratos
    volumes:
      - kratos_pgdata-e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["test"]

  kratos-e2e:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://kratos:kratos@kratos-db-e2e:5432/kratos?sslmode=disable
      # SECRETS_CIPHER must be exactly 32 characters (Kratos's AES-256-GCM
      # cipher key requirement, see ory/README.md) — Kratos refuses to start
      # otherwise.
      SECRETS_COOKIE: e2e-32-byte-kratos-cookie-secret
      SECRETS_CIPHER: e2e-32-byte-kratos-cipher-secret
      # Step 44: same shared provider config as the dev `kratos` service (see
      # .env.example) — dex is reachable from this project's own `dex-e2e`
      # container (aliased as `dex`) via Docker's internal DNS either way.
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS: ${KRATOS_OIDC_PROVIDERS_JSON}
      # Step 44: unlike every other e2e-facing endpoint (reached only through
      # web-e2e's same-origin `/api/kratos/*` proxy), the dex OIDC callback
      # redirect is issued directly to the browser by dex and must resolve
      # to *this* Kratos instance, not the dev `kratos` service sharing the
      # same kratos.yml (whose serve.public.base_url is hardcoded to
      # http://localhost:4433/). Overriding it here to a dedicated host port
      # keeps the two instances' callback URLs distinct; see ory/dex/config.yaml
      # (whose redirectURIs list includes this exact URL) and
      # docs/tasks/step44.md's Implementation notes for the alternatives
      # considered (e.g. routing through the web-e2e proxy instead).
      SERVE_PUBLIC_BASE_URL: http://localhost:8093/
      # Step 44: kratos.yml's default_browser_return_url/allowed_return_urls
      # are hardcoded to http://localhost:3000/ (the dev `web` service) —
      # after a successful OIDC callback, Kratos issues a real browser
      # redirect straight to this URL (there is no `/api/kratos/*` proxy hop
      # to rewrite it through), so left unoverridden the E2E browser would
      # land on the dev app (or nowhere, if it isn't running) instead of
      # `web-e2e` on :3001. Verified end to end against a standalone
      # Kratos+dex pair while implementing this step.
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: http://localhost:3001/
      SELFSERVICE_ALLOWED_RETURN_URLS: '["http://localhost:3001/"]'
      # Wave-5 review (round 2): Kratos defaults
      # selfservice.methods.password.config.haveibeenpwned_enabled to true,
      # which makes every E2E registration depend on a live call to the
      # external HIBP API. That is both non-hermetic (breaks the e2e stack
      # offline) and a source of real flakes — a transient/false-positive
      # HIBP hit (or a static spec password genuinely entering the public
      # breach corpus over time) fails registration nondeterministically.
      # Disabled only for this e2e instance; the dev `kratos` service above
      # keeps the default (real) behavior.
      SELFSERVICE_METHODS_PASSWORD_CONFIG_HAVEIBEENPWNED_ENABLED: "false"
    # No `--watch-courier` here (unlike the dev `kratos` service above): no
    # e2e spec ever awaits a courier-delivered email, and running it under
    # full-suite parallel load produces nothing but repeated "Unable to send
    # email using SMTP connection" noise against `mailslurper-e2e` (wave-8
    # review carryover). Dropping it only from this e2e-only service leaves
    # the dev instance's courier behavior untouched.
    command: serve -c /etc/config/kratos/kratos.yml --dev
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
    ports:
      - "8093:4433"
      - "8094:4434"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4434/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["test"]
    depends_on:
      kratos-migrate-e2e:
        condition: service_completed_successfully
      dex-e2e:
        condition: service_healthy

  kratos-migrate-e2e:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://kratos:kratos@kratos-db-e2e:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    volumes:
      - ./ory/kratos:/etc/config/kratos:ro
    profiles: ["test"]
    depends_on:
      kratos-db-e2e:
        condition: service_healthy

  llm-gateway-e2e:
    build:
      # See the dev `llm-gateway` service above: build.rs needs server/proto/ inside
      # the build context, so this uses the repo root too.
      context: .
      dockerfile: llm-gateway/Dockerfile
    environment:
      LLM_GATEWAY_PORT: 8081
      OPENAI_API_KEY: e2e-dummy-key
      OPENAI_BASE_URL: http://llm-stub:8092
    ports:
      - "8091:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["test"]
    depends_on:
      llm-stub:
        condition: service_healthy

  llm-stub:
    build:
      context: ./llm-stub
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8092/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["test"]

  mailslurper-e2e:
    image: oryd/mailslurper:latest-smtps
    # kratos.yml's courier config is shared verbatim with the dev `kratos`
    # service and hardcodes `smtps://test:test@mailslurper:1025/...` — this
    # alias makes that hostname resolve to this e2e-only mail relay too, so
    # kratos-e2e's courier doesn't need its own copy of kratos.yml just to
    # reach it under this service's real (namespaced) name.
    networks:
      default:
        aliases:
          - mailslurper
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4436/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["test"]

  migrate-e2e:
    image: arigaio/atlas:latest
    command: >
      migrate apply
      --url "postgres://polyphony:polyphony@db-e2e:5432/polyphony?sslmode=disable"
      --dir "file://migrations"
    volumes:
      - ./server/migrations:/migrations:ro
    profiles: ["test"]
    depends_on:
      db-e2e:
        condition: service_healthy

  # A dedicated e2e-only MinIO, distinct from the dev `minio` service above:
  # this stack must be self-contained -- `test:e2e:up`'s explicit service
  # list intentionally omits the untagged dev `minio`/`minio-init` services
  # (see that task's own comment), so without its own MinIO here,
  # `attachments.spec.ts`'s presigned-upload PUT would silently depend on
  # whatever process happens to hold host port 9000. Published on a
  # dedicated host port (9002) rather than 9000 so this stack can run fully
  # alongside a running dev stack, same reasoning as `dex-e2e`/`kratos-e2e`
  # above.
  minio-e2e:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: polyphony
      MINIO_ROOT_PASSWORD: polyphony-minio
    ports:
      - "9002:9000"
    volumes:
      - miniodata-e2e:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["test"]

  minio-init-e2e:
    image: minio/mc
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-e2e:9000 polyphony polyphony-minio &&
      mc mb -p local/polyphony-attachments
      "
    profiles: ["test"]
    depends_on:
      minio-e2e:
        condition: service_healthy

  redis-e2e:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["test"]

  web-e2e:
    build:
      context: ./web
      args:
        # api-e2e's *host-published* origin (8090:8080 above), NOT the dev
        # api's 8080: NEXT_PUBLIC_API_URL is what the browser itself dials
        # directly for the WebSocket upgrade (`getWsBaseUrl()` in
        # web/src/config/env.ts -- the BFF proxy cannot upgrade a WS
        # handshake). Built with the dev-stack default 8080, every live-WS
        # spec (two-client-realtime, streaming, private-mode) dials a port
        # this stack does not own and no realtime event is ever delivered
        # (caught live by the wave-7 integration run). Kept as its own
        # variable so a plain `NEXT_PUBLIC_API_URL` in .env cannot silently
        # repoint the e2e web build at the dev API again.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_E2E:-http://localhost:8090}
    environment:
      API_URL: http://api-e2e:8080
      KRATOS_PUBLIC_URL: http://kratos-e2e:4433
      # Step 56: needed by `app/(auth)/oauth/{login,consent}/route.ts` (see
      # `web/src/lib/hydra-admin.ts`) so those routes can call the e2e-only
      # `hydra-e2e` service's admin API instead of the dev `hydra` service.
      HYDRA_ADMIN_URL: http://hydra-e2e:4445
    ports:
      - "3001:3000"
    profiles: ["test"]
    depends_on:
      api-e2e:
        condition: service_healthy

volumes:
  pgdata:
  pgdata-e2e:
  hydra_pgdata:
  hydra_pgdata-e2e:
  kratos_pgdata:
  kratos_pgdata-e2e:
  miniodata:
  miniodata-e2e:
