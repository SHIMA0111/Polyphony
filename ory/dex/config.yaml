# Dex (dexidp/dex) mock OIDC provider, used so this app's "Login with
# Google/GitHub" feature (phases.md, Phase 15) can be exercised end to end
# without registering a real OAuth application anywhere (see
# docs/tasks/step44.md). Kratos's `selfservice.methods.oidc` "dex" provider
# (configured via KRATOS_OIDC_PROVIDERS_JSON, see .env.example) points at
# this service; the real Google/GitHub providers remain configured
# alongside it but are never exercised by automated tests.
#
# `issuer` must resolve to this exact URL both from inside the Compose
# network (Kratos's server-side OIDC discovery + token exchange, via
# Docker's built-in DNS for the `dex` hostname) and from the developer's/
# Playwright's host browser (redirected here during the authorization step).
# The host browser cannot resolve `dex` by default; see ory/README.md for the
# manual `/etc/hosts` workaround and web/playwright.config.ts for the
# equivalent, fully automated Chromium `--host-resolver-rules` flag.
issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # No consent screen: dex has a single static client/user, and Playwright
  # drives this login unattended end to end.
  skipApprovalScreen: true

staticClients:
  - id: polyphony-web
    # Keep in sync with .env.example's DEX_CLIENT_SECRET and the "dex" entry
    # inside KRATOS_OIDC_PROVIDERS_JSON — Kratos authenticates to dex's token
    # endpoint with this client id/secret pair.
    secret: dex-client-secret-change-me
    name: Polyphony (via Kratos)
    redirectURIs:
      # dev Kratos (Step 11): host port 4433, reachable both by the host
      # browser and by other containers via Docker's internal DNS.
      - http://localhost:4433/self-service/methods/oidc/callback/dex
      - http://kratos:4433/self-service/methods/oidc/callback/dex
      # E2E Kratos (`kratos-e2e`, Step 30): unlike the dev `kratos` service,
      # `kratos-e2e` publishes no host port for its own API traffic (the web
      # app reaches it only through the same-origin `/api/kratos/*` proxy on
      # `web-e2e`). The OIDC callback redirect, however, is issued directly
      # to the browser by dex and must be host-reachable on its own, so
      # `kratos-e2e` is given a dedicated host port (8093) plus a matching
      # `SERVE_PUBLIC_BASE_URL` override — see docker-compose.yml.
      - http://localhost:8093/self-service/methods/oidc/callback/dex
      - http://kratos-e2e:4433/self-service/methods/oidc/callback/dex

enablePasswordDB: true
staticPasswords:
  # Fixture test user for local/automated OIDC login (web/e2e/oauth-dex.spec.ts
  # and web/e2e/support/fixtures.ts source these same credentials from
  # DEX_STATIC_TEST_EMAIL/DEX_STATIC_TEST_PASSWORD in .env.example). Never a
  # real account; documented in ory/README.md as test-only.
  - email: oidc-fixture@example.com
    # Generated with: htpasswd -bnBC 10 oidc-fixture 'DexFixtureP@ssw0rd!'
    # (dex's CLI has no `dex hash-password` subcommand as of v2.43.1; any
    # bcrypt hash of the matching cost works, this is not a hand-written
    # placeholder).
    hash: "$2y$10$4UE9.H4SQLWakdHmXvnYV.nLV7opMsnJckC.XLqIdWvJYtaRiYSBS"
    username: oidc-fixture
    userID: oidc-fixture-static-user
