# Dev-only override for Step 31's multi-instance verification
# (docs/tasks/step31.md). The base docker-compose.yml publishes a fixed
# "8080:8080" host port mapping for `api`, which is right for normal
# single-instance local dev but collides across replicas when scaling with
# `--scale api=2`. Compose list-typed keys (like `ports`) are merged, not
# replaced, across `-f` files by default — so without the `!override` merge
# tag below, each scaled replica would still publish the base file's
# "8080:8080" mapping *in addition to* this file's bare "8080" entry, and
# `--scale api=2` would fail with "Bind for 0.0.0.0:8080 failed: port is
# already allocated". The `!override` tag makes this file's `ports` list
# substitute the base file's list entirely, so each replica gets only a
# single, auto-assigned host port. This file is never used by `task up` or a
# plain `docker compose up` — only referenced explicitly with `-f`, e.g.:
#
#   docker compose -f docker-compose.yml -f docker-compose.scale-test.yml \
#     up -d --scale api=2
#
# Then resolve each replica's assigned host port with:
#   docker compose port --index=1 api 8080
#   docker compose port --index=2 api 8080
#
# The `!override` merge tag requires Docker Compose v2.24.0 or later; on
# older Compose versions this file fails to parse.
services:
  api:
    ports: !override
      - "8080"
