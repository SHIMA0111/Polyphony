# Dev-only override for Step 31's multi-instance verification
# (docs/tasks/step31.md). The base docker-compose.yml publishes a fixed
# "8080:8080" host port mapping for `api`, which is right for normal
# single-instance local dev but collides across replicas when scaling with
# `--scale api=2`. This file overrides only that one key so Compose assigns a
# distinct random host port per replica; it is never used by `task up` or a
# plain `docker compose up` — only referenced explicitly with `-f`, e.g.:
#
#   docker compose -f docker-compose.yml -f docker-compose.scale-test.yml \
#     up -d --scale api=2
#
# Then resolve each replica's assigned host port with:
#   docker compose port --index=1 api 8080
#   docker compose port --index=2 api 8080
services:
  api:
    ports:
      - "8080"
