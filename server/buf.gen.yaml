# Codegen plan for the Go client stubs of the shared LLM Gateway gRPC contract
# (Step 28: Go gRPC LLM client swap).
#
# Regenerate with, from server/:
#
#   buf generate
#
# This requires `protoc-gen-go` and `protoc-gen-go-grpc` on PATH (installable via
# `go install google.golang.org/protobuf/cmd/protoc-gen-go@latest` and
# `go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest`). The generated
# files are committed to the repository (there is no CI codegen step yet), so
# regeneration is only needed when proto/llmgateway/v1/*.proto changes.
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/interface/gateway/grpc/llmgatewaypb
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/interface/gateway/grpc/llmgatewaypb
    opt:
      - paths=source_relative
