# Codegen plan for the Go client stubs of the shared LLM Gateway gRPC contract
# (Step 28: Go gRPC LLM client swap).
#
# Regenerate with, from server/:
#
#   buf generate
#
# This requires `protoc-gen-go` and `protoc-gen-go-grpc` on PATH (installable via
# `go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11` and
# `go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2`). Pinned to
# concrete versions — rather than `@latest` — consistent with this module's
# go.mod pins (google.golang.org/protobuf v1.36.11, google.golang.org/grpc
# v1.82.0; protoc-gen-go-grpc is tagged independently of the main grpc-go
# module, so v1.6.2 is its own latest release as of this pin, not v1.82.0)
# so two developers regenerating on different days don't produce a spurious
# diff in the committed generated files from an unpinned plugin drifting out
# from under them. The generated files are committed to the repository
# (there is no CI codegen step yet), so regeneration is only needed when
# proto/llmgateway/v1/*.proto changes.
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/interface/gateway/grpc/llmgatewaypb
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/interface/gateway/grpc/llmgatewaypb
    opt:
      - paths=source_relative
