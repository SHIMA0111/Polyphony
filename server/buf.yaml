# Buf module configuration for the shared LLM Gateway gRPC contract.
#
# The canonical proto source lives in ./proto (server/proto/llmgateway/v1/*.proto);
# see docs/tasks/step19.md's "Proto location rationale" for why it is vendored here
# rather than in a separate top-level directory. The Rust LLM Gateway consumes the
# same files directly via tonic-build (see llm-gateway/build.rs) -- this module only
# governs the Go-side codegen invoked by `buf generate` (see buf.gen.yaml).
version: v2
modules:
  - path: proto
lint:
  use:
    - DEFAULT
  except:
    # proto/llmgateway/v1/*.proto declares `package polyphony.llmgateway.v1;`
    # but lives at proto/llmgateway/v1/ (module root is ./proto), one path
    # segment short of what PACKAGE_DIRECTORY_MATCH expects for that package
    # name -- a deliberate, documented flat layout (see docs/tasks/step19.md's
    # "Proto location rationale") rather than an oversight, so it is excluded
    # here instead of being left to fail a future `buf lint` run.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
