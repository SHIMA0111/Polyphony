version: '3'

tasks:
  # ---------------------------------------------------------------------------
  # Docker
  # ---------------------------------------------------------------------------
  up:
    desc: Start all services
    cmds:
      - docker compose up -d

  rebuild:
    desc: Rebuild all Docker images from scratch and restart the stack
    cmds:
      - docker compose build --no-cache
      - docker compose up -d --force-recreate

  down:
    desc: Stop all services
    cmds:
      - docker compose down

  down:clean:
    desc: Stop all services and remove volumes
    cmds:
      - docker compose down -v

  build:
    desc: Build all Docker images
    cmds:
      - docker compose build

  logs:
    desc: Tail service logs (use -- <service> to filter)
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  ps:
    desc: Show running services
    cmds:
      - docker compose ps

  # ---------------------------------------------------------------------------
  # Migration
  # ---------------------------------------------------------------------------
  migrate:generate:
    desc: Generate migration SQL from schema.sql diff
    dir: server
    vars:
      NAME: '{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}auto_{{now | date "20060102150405"}}{{end}}'
    cmds:
      - atlas migrate diff {{.NAME}} --env local

  migrate:apply:
    desc: Start db and run migrations via Docker
    cmds:
      - docker compose up -d db
      - docker compose run --rm migrate

  migrate:status:
    desc: Show migration status
    dir: server
    cmds:
      - atlas migrate status --env local

  migrate:lint:
    # Requires `atlas login` (Atlas v0.38+ gates `migrate lint` behind an Atlas Pro account).
    # See docs/infra-conventions.md for the login step and a manual-review fallback.
    desc: Lint the latest migration for destructive/unsafe changes (requires `atlas login`)
    dir: server
    cmds:
      - atlas migrate lint --env local --latest 1

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  test:
    desc: Run all tests in parallel
    deps: [test:server, test:gateway, test:web]

  test:server:
    desc: Run Go tests
    dir: server
    cmds:
      - go test ./...

  test:server:integration:
    desc: Run Go integration tests against a real Postgres testcontainer (requires Docker)
    dir: server
    cmds:
      - go test -tags=integration ./...

  test:gateway:
    desc: Run Rust tests
    dir: llm-gateway
    cmds:
      - cargo test

  test:web:
    desc: Run web frontend tests
    dir: web
    cmds:
      - bun run test

  # ---------------------------------------------------------------------------
  # Lint & Format
  # ---------------------------------------------------------------------------
  lint:
    desc: Lint all projects in parallel
    deps: [lint:server, lint:gateway, lint:web]

  lint:server:
    desc: Lint Go code
    dir: server
    cmds:
      - golangci-lint run ./...

  lint:gateway:
    desc: Lint Rust code
    dir: llm-gateway
    cmds:
      - cargo clippy

  lint:web:
    desc: Lint web frontend
    dir: web
    cmds:
      - bun run lint

  fmt:
    desc: Format all projects in parallel
    deps: [fmt:server, fmt:gateway]

  fmt:server:
    desc: Format Go code
    dir: server
    cmds:
      - go fmt ./...

  fmt:gateway:
    desc: Format Rust code
    dir: llm-gateway
    cmds:
      - cargo fmt

  # ---------------------------------------------------------------------------
  # Local Development
  # ---------------------------------------------------------------------------
  dev:server:
    desc: Run Go API server locally
    dir: server
    dotenv: ['../.env.local', '../.env']
    cmds:
      - go run ./cmd/api

  dev:gateway:
    desc: Run LLM Gateway locally
    dir: llm-gateway
    dotenv: ['../.env.local', '../.env']
    cmds:
      - cargo run

  dev:web:
    desc: Run web frontend dev server
    dir: web
    dotenv: ['../.env.local', '../.env']
    cmds:
      - bun run dev
